name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: >
          uv run pytest
          --cov-branch
          --cov-fail-under=100
          --cov-report=xml
          --cov-report=term-missing:skip-covered
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python3.15

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python3.15

  prek:
    name: Prek checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run prek
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  publish:
    name: Publish the container image
    needs: [test, prek]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # hatch-vcs reads the version from the tags, so fetch the whole history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GitHub Actions cache backend of buildx reads these variables
      # from the environment, and a plain run step does not receive them.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # docker-bake.hcl holds the tags, platforms, labels, and annotations, so
      # this build is the one `docker buildx bake` makes on a laptop. The
      # commit's committer time sets SOURCE_DATE_EPOCH, which BuildKit uses as
      # the image's creation time.
      - name: Build and push the image
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          REVISION="$(git rev-parse HEAD)"
          VERSION="$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          CREATED="$(git log -1 --format=%cI)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export REVISION VERSION CREATED SOURCE_DATE_EPOCH
          docker buildx bake --push
