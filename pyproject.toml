[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "prometheus-mcp"
dynamic = ["version"]
description = "An MCP server for querying multiple Prometheus instances, with PromQL passthrough and ASCII-art charts for agents."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.15"
license = { file = "LICENSE" }
authors = [{ name = "Chris Guidry", email = "guid@omg.lol" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "asciichartpy>=1.5.25",
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
]

[project.scripts]
prometheus-mcp = "prometheus_mcp.__main__:main"

[project.urls]
"Repository" = "https://github.com/chrisguidry/prometheus-mcp"
"Bug Tracker" = "https://github.com/chrisguidry/prometheus-mcp/issues"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "loq>=0.2.0",
    "mypy>=2.4.1",
    "prek>=0.5.10",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_mcp"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Shared"]

[tool.pytest.ini_options]
addopts = [
    "--cov=src/prometheus_mcp",
    "--cov=tests",
    "--cov-report=term-missing:skip-covered",
    "--cov-branch",
    "--cov-fail-under=100",
    "--timeout=30",
    "--import-mode=importlib",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
    "error",
    # py-key-value-aio runs beartype on its own classes under pytest, and
    # beartype calls isinstance() on their AsyncKeyValue protocol, which is
    # not @runtime_checkable.  Python 3.15 deprecates that call, so beartype
    # skips those classes and warns that it did.  Only py-key-value-aio
    # brings beartype in, so the whole category is safe to ignore.
    "ignore::beartype.roar.BeartypeClawDecorWarning",
]

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$"]

[[tool.mypy.overrides]]
# asciichartpy ships no type information.
module = ["asciichartpy"]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
